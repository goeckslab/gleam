  long_description: |
    MultimodalLearner is a Galaxy tool for training and evaluating multimodal machine learning models.
    It supports the joint use of tabular, image, and text data, providing a user-friendly interface for configuring model backbones, fusion strategies, and evaluation settings. The tool streamlines dataset management and report generation, making multimodal modeling accessible to users with varying levels of expertise in machine learning.
