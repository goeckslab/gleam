remote_repository_url: https://github.com/goeckslab/gleam.git
homepage_url: https://github.com/goeckslab/gleam/tree/main/tools/multimodallearner
long_description: |
    Multimodal Learner is a galaxy tool for training and evaluating multimodal machine learn.
    It supports the joint use of structured data-numerical and categorical-and unstructured data-pixel images and text-, providing a user-friendly interface for configuring model backbones, fusion strategies, and evaluation settings. The tool streamlines dataset management and report generation, making multimodal modeling accessible to user with varying levels of expertise in machine learning.
