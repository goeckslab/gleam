name: Deploy PR Preview

on:
  push:
    branches-ignore:
      - main
      - master
      - gh-pages
    paths:
      - "docs/**"
      - ".github/workflows/pr-preview.yml"
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - closed
    paths:
      - "docs/**"
      - ".github/workflows/pr-preview.yml"

permissions:
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: pr-preview-gh-pages
  cancel-in-progress: false

jobs:
  resolve_pr:
    name: Resolve preview target
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.resolve.outputs.action }}
      has_pr: ${{ steps.resolve.outputs.has_pr }}
      head_repo: ${{ steps.resolve.outputs.head_repo }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      same_repo: ${{ steps.resolve.outputs.same_repo }}
    steps:
      - name: Resolve PR metadata
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            head_query="$(jq -rn --arg head "${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" '$head | @uri')"
            pr_json="$(curl -fsSL \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${head_query}" \
              | jq -c '.[0] // empty')"
            pr_number="$(jq -r '.number // empty' <<< "${pr_json}")"

            if [ -z "${pr_number}" ]; then
              echo "has_pr=false" >> "${GITHUB_OUTPUT}"
              echo "No open pull request found for ${GITHUB_REF_NAME}; skipping preview."
              exit 0
            fi

            echo "action=synchronize" >> "${GITHUB_OUTPUT}"
            echo "has_pr=true" >> "${GITHUB_OUTPUT}"
            echo "head_repo=${GITHUB_REPOSITORY}" >> "${GITHUB_OUTPUT}"
            echo "head_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"
            echo "same_repo=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          action="$(jq -r '.action' "${GITHUB_EVENT_PATH}")"
          head_repo="$(jq -r '.pull_request.head.repo.full_name' "${GITHUB_EVENT_PATH}")"
          head_sha="$(jq -r '.pull_request.head.sha' "${GITHUB_EVENT_PATH}")"
          pr_number="$(jq -r '.pull_request.number' "${GITHUB_EVENT_PATH}")"

          echo "action=${action}" >> "${GITHUB_OUTPUT}"
          echo "has_pr=true" >> "${GITHUB_OUTPUT}"
          echo "head_repo=${head_repo}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${head_sha}" >> "${GITHUB_OUTPUT}"
          echo "pr_number=${pr_number}" >> "${GITHUB_OUTPUT}"

          if [ "${head_repo}" = "${GITHUB_REPOSITORY}" ]; then
            echo "same_repo=true" >> "${GITHUB_OUTPUT}"
          else
            echo "same_repo=false" >> "${GITHUB_OUTPUT}"
          fi

  publish_preview:
    name: Publish preview
    needs: resolve_pr
    if: >-
      ${{
        needs.resolve_pr.outputs.has_pr == 'true' &&
        needs.resolve_pr.outputs.same_repo == 'true' &&
        needs.resolve_pr.outputs.action != 'closed'
      }}
    runs-on: ubuntu-latest
    env:
      PREVIEW_PATH: previews/pr-${{ needs.resolve_pr.outputs.pr_number }}
      PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/pr-${{ needs.resolve_pr.outputs.pr_number }}/
    steps:
      - name: Check out PR source
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.resolve_pr.outputs.head_repo }}
          ref: ${{ needs.resolve_pr.outputs.head_sha }}
          path: source
          persist-credentials: false

      - name: Check out preview branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Validate static docs
        run: |
          set -euo pipefail
          test -f source/docs/index.html
          if find source/docs -type l | grep -q .; then
            echo "Refusing to publish docs containing symlinks."
            find source/docs -type l -print
            exit 1
          fi

      - name: Copy preview files
        run: |
          set -euo pipefail
          mkdir -p "gh-pages/${PREVIEW_PATH}"
          rsync -a --delete source/docs/ "gh-pages/${PREVIEW_PATH}/"
          touch gh-pages/.nojekyll

      - name: Commit preview
        id: commit
        run: |
          set -euo pipefail
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch previews/pr-null
          git add .nojekyll "${PREVIEW_PATH}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Preview is already up to date."
            exit 0
          fi
          git commit -m "Update PR ${{ needs.resolve_pr.outputs.pr_number }} preview"
          git push origin HEAD:gh-pages
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Comment preview URL
        uses: actions/github-script@v8
        with:
          script: |
            const marker = "<!-- gleam-pr-preview -->";
            const issue_number = Number("${{ needs.resolve_pr.outputs.pr_number }}");
            const previewUrl = "${{ env.PREVIEW_URL }}";
            const sha = "${{ needs.resolve_pr.outputs.head_sha }}".slice(0, 7);
            const body = `${marker}\nPreview: ${previewUrl}\n\nUpdated for commit \`${sha}\`.`;
            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user.type === "Bot" && comment.body.includes(marker)
            );
            if (previous) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  cleanup_preview:
    name: Remove closed preview
    needs: resolve_pr
    if: >-
      ${{
        needs.resolve_pr.outputs.has_pr == 'true' &&
        needs.resolve_pr.outputs.action == 'closed'
      }}
    runs-on: ubuntu-latest
    env:
      PREVIEW_PATH: previews/pr-${{ needs.resolve_pr.outputs.pr_number }}
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Remove preview
        id: cleanup
        run: |
          set -euo pipefail
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch "${PREVIEW_PATH}"
          if git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "No preview files to remove."
            exit 0
          fi
          git commit -m "Remove PR ${{ needs.resolve_pr.outputs.pr_number }} preview"
          git push origin HEAD:gh-pages
          echo "changed=true" >> "${GITHUB_OUTPUT}"
