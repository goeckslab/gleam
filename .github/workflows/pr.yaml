name: Galaxy Tool Linting and Tests for push and PR
on:
  pull_request:
    paths-ignore:
      - 'deprecated/**'
      - 'docs/**'
      - '*'
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'deprecated/**'
      - 'docs/**'
      - '*'
env:
  GALAXY_FORK: galaxyproject
  GALAXY_BRANCH: release_26.0
  MAX_CHUNKS: 4
  MAX_FILE_SIZE: 2M
concurrency:
  # Group runs by PR, but keep runs on the default branch separate
  # because we do not want to cancel ToolShed uploads
  group: pr-${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.run_number || github.ref }}
  cancel-in-progress: true
jobs:
  # the setup job does two things:
  # 1. cache the pip cache and .planemo
  # 2. determine the list of changed repositories
  # it produces one artifact which contains
  # - a file with the latest SHA from the chosen branch of the Galaxy repo
  # - a file containing the list of changed repositories
  # which are needed in subsequent steps.
  setup:
    name: Setup cache and determine changed repositories
    runs-on: ubuntu-latest
    outputs:
      galaxy-head-sha: ${{ steps.get-galaxy-sha.outputs.galaxy-head-sha }}
      repository-list: ${{ steps.discover.outputs.repository-list }}
      tool-list: ${{ steps.discover.outputs.tool-list }}
      chunk-count: ${{ steps.discover.outputs.chunk-count }}
      chunk-list: ${{ steps.discover.outputs.chunk-list }}
      commit-range: ${{ steps.discover.outputs.commit-range }}
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
    - name: Print github context properties
      run: |
        echo 'event: ${{ github.event_name }}'
        echo 'sha: ${{ github.sha }}'
        echo 'ref: ${{ github.ref }}'
        echo 'head_ref: ${{ github.head_ref }}'
        echo 'base_ref: ${{ github.base_ref }}'
        echo 'event.before: ${{ github.event.before }}'
        echo 'event.after: ${{ github.event.after }}'
    - name: Determine latest commit in the Galaxy repo
      id: get-galaxy-sha
      run: echo "galaxy-head-sha=$(git ls-remote https://github.com/${{ env.GALAXY_FORK }}/galaxy refs/heads/${{ env.GALAXY_BRANCH }} | cut -f1)" >> $GITHUB_OUTPUT
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache .cache/pip
      uses: actions/cache@v5
      id: cache-pip
      with:
        path: ~/.cache/pip
        key: pip_cache_py_${{ matrix.python-version }}_gxy_${{ steps.get-galaxy-sha.outputs.galaxy-head-sha }}
    - name: Cache .planemo
      uses: actions/cache@v5
      id: cache-planemo
      with:
        path: ~/.planemo
        key: planemo_cache_py_${{ matrix.python-version }}_gxy_${{ steps.get-galaxy-sha.outputs.galaxy-head-sha }}
    - name: Prune stale Planemo Galaxy venvs
      run: |
        set -euo pipefail
        mkdir -p ~/.planemo
        for venv in ~/.planemo/gx_venv_*; do
          if [ ! -d "$venv" ]; then
            continue
          fi
          if [ ! -x "$venv/bin/python" ]; then
            echo "Removing stale venv without python: $venv"
            rm -rf "$venv"
            continue
          fi
          if [ ! -x "$venv/bin/galaxyctl" ]; then
            echo "Removing stale venv without galaxyctl: $venv"
            rm -rf "$venv"
          fi
        done
    # Install the `wheel` package so that when installing other packages which
    # are not available as wheels, pip will build a wheel for them, which can be cached.
    - name: Install wheel
      run: pip install wheel
    - name: Install flake8
      run: pip install flake8 flake8-import-order
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Fake a Planemo run to update cache and determine commit range, repositories, and chunks
      uses: galaxyproject/planemo-ci-action@v1
      id: discover
      with:
        create-cache: ${{ steps.cache-pip.outputs.cache-hit != 'true' || steps.cache-planemo.outputs.cache-hit != 'true' }}
        galaxy-fork: ${{ env.GALAXY_FORK }}
        galaxy-branch: ${{ env.GALAXY_BRANCH }}
        max-chunks: ${{ env.MAX_CHUNKS }}
        python-version: ${{ matrix.python-version }}
    - name: Show commit range
      run: echo '${{ steps.discover.outputs.commit-range }}'
    - name: Show repository list
      run: echo '${{ steps.discover.outputs.repository-list }}'
    - name: Show tool list
      run: echo '${{ steps.discover.outputs.tool-list }}'
    - name: Show chunks
      run: |
        echo 'Using ${{ steps.discover.outputs.chunk-count }} chunks (${{ steps.discover.outputs.chunk-list }})'

  # Planemo lint the changed repositories
  lint:
    name: Lint tool-list
    needs: setup
    if: ${{ needs.setup.outputs.repository-list != '' || needs.setup.outputs.tool-list != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache .cache/pip
      uses: actions/cache@v5
      id: cache-pip
      with:
        path: ~/.cache/pip
        key: pip_cache_py_${{ matrix.python-version }}_gxy_${{ needs.setup.outputs.galaxy-head-sha }}

    - name: Set default skip options for push event (i.e. merge to main)
      if: ${{ github.event_name != 'pull_request' }}
      run:
        echo "EXTRA_SKIP=--skip version_bumped" >> "$GITHUB_ENV"
    - name: Find Pull Request
      if: ${{ github.event_name == 'pull_request' }}
      id: find-pr
      uses: sharesight/find-github-pull-request@v1.3.0
      with:
        allowClosed: true
        failIfNotFound: true
    - name: Get labels of the PR
      if: ${{ github.event_name == 'pull_request' }}
      uses: snnaplab/get-labels-action@v1
      with:
        number: ${{ steps.find-pr.outputs.number }}
    - name: Print PR and label info
      if: ${{ github.event_name == 'pull_request' }}
      run: |
        echo number: ${{ steps.find-pr.outputs.number }}
        echo labels: ${{ env.LABELS }}
    - name: Conditionally skip URL/version linter
      if: ${{ github.event_name == 'pull_request' }}
      run: |
          set -x

          to_skip=()
          if echo '${{ env.LABELS }}' | jq -e --arg s "skip-url-check" 'index($s)' > /dev/null; then
            to_skip+=("tool_urls")
          fi
          if echo '${{ env.LABELS }}' | jq -e --arg s "skip-version-check" 'index($s)' > /dev/null; then
            to_skip+=("version_bumped")
          fi

          if [ ${#to_skip[@]} -gt 0 ]; then
            RESULT=$(IFS=,; echo "${to_skip[*]}")
            echo "EXTRA_SKIP=--skip $RESULT" >> "$GITHUB_ENV"
          else
            echo "EXTRA_SKIP=" >> "$GITHUB_ENV"
          fi
    - name: Planemo lint
      uses: galaxyproject/planemo-ci-action@v1
      id: lint
      with:
        mode: lint
        fail-level: error
        repository-list: ${{ needs.setup.outputs.repository-list }}
        tool-list: ${{ needs.setup.outputs.tool-list }}
        additional-planemo-options: ${{ env.EXTRA_SKIP }}
    - uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: 'Tool linting output'
        path: lint_report.txt

  # flake8 of Python scripts in the changed repositories
  flake8:
    name: Lint Python scripts
    needs: setup
    if: ${{ github.event_name == 'pull_request' && needs.setup.outputs.repository-list != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache .cache/pip
      uses: actions/cache@v5
      id: cache-pip
      with:
        path: ~/.cache/pip
        key: pip_cache_py_${{ matrix.python-version }}_gxy_${{ needs.setup.outputs.galaxy-head-sha }}
    - name: Install flake8
      run: pip install flake8 flake8-import-order
    - name: Flake8
      run: echo '${{ needs.setup.outputs.repository-list }}' | xargs -d '\n' flake8 --max-line-length=120 --output-file pylint_report.txt --tee
    - uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: 'Python linting output'
        path: pylint_report.txt

  file_sizes:
    name: Check file sizes
    needs: setup
    if: ${{ github.event_name == 'pull_request' && needs.setup.outputs.repository-list != '' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Check file sizes
      run: |
        touch file_size_report.txt
        git diff --diff-filter=d --name-only ${{ needs.setup.outputs.commit-range }} > git.diff
        while read line; do
          find "$line" -type f -size +${{ env.MAX_FILE_SIZE }} >> file_size_report.txt
        done < git.diff
        if [[ -s file_size_report.txt ]]; then
          echo "Files larger than ${{ env.MAX_FILE_SIZE }} found"
          cat file_size_report.txt
          exit 1
        fi
    - uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: 'File size report'
        path: file_size_report.txt

  # Planemo test the changed repositories, each chunk creates an artifact
  # containing HTML and JSON reports for the executed tests
  test:
    name: Test tools
    needs: setup
    if: ${{ needs.setup.outputs.repository-list != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.setup.outputs.chunk-list) }}
        python-version: ['3.11']
    services:
      postgres:
        image: postgres:11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    steps:
    - name: Free disk space
      run: |
        echo "Disk usage BEFORE cleanup:"
        df -h
        echo "Removing .NET..."
        sudo rm -rf /usr/share/dotnet || true
        echo "Removing Android SDK..."
        sudo rm -rf /usr/local/lib/android || true
        echo "Removing Haskell..."
        sudo rm -rf /opt/ghc || true
        sudo rm -rf /usr/local/.ghcup || true
        echo "Docker prune..."
        sudo docker system prune -af || true
        echo "Disk usage AFTER cleanup:"
        df -h
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache .cache/pip
      uses: actions/cache@v5
      id: cache-pip
      with:
        path: ~/.cache/pip
        key: pip_cache_py_${{ matrix.python-version }}_gxy_${{ needs.setup.outputs.galaxy-head-sha }}
    - name: Cache .planemo
      uses: actions/cache@v5
      id: cache-planemo
      with:
        path: ~/.planemo
        key: planemo_cache_py_${{ matrix.python-version }}_gxy_${{ needs.setup.outputs.galaxy-head-sha }}
    - name: Prune stale Planemo Galaxy venvs
      run: |
        set -euo pipefail
        mkdir -p ~/.planemo
        for venv in ~/.planemo/gx_venv_*; do
          if [ ! -d "$venv" ]; then
            continue
          fi
          if [ ! -x "$venv/bin/python" ]; then
            echo "Removing stale venv without python: $venv"
            rm -rf "$venv"
            continue
          fi
          if [ ! -x "$venv/bin/galaxyctl" ]; then
            echo "Removing stale venv without galaxyctl: $venv"
            rm -rf "$venv"
          fi
        done
    - name: Get number of CPU cores
      uses: SimenB/github-actions-cpu-cores@v2
      id: cpu-cores
    - name: Planemo test
      uses: galaxyproject/planemo-ci-action@v1
      id: test
      with:
        mode: test
        repository-list: ${{ needs.setup.outputs.repository-list }}
        galaxy-fork: ${{ env.GALAXY_FORK }}
        galaxy-branch: ${{ env.GALAXY_BRANCH }}
        chunk: ${{ matrix.chunk }}
        chunk-count: ${{ needs.setup.outputs.chunk-count }}
        galaxy-slots: ${{ steps.cpu-cores.outputs.count }}
        # Limit each test to 15 minutes
        test_timeout: 1800
    - uses: actions/upload-artifact@v7
      with:
        name: 'Tool test output ${{ matrix.chunk }}'
        path: upload

  # - combine the results of the test chunks (which will never fail due
  #   to `|| true`) and create a global test report as json and html which
  #   is provided as artifact
  # - check if any tool test actually failed (by lookup in the combined json)
  #   and fail this step if this is the case
  combine_outputs:
    name: Combine chunked test results
    needs: [setup, test]
    if: ${{ always() && needs.setup.outputs.repository-list != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: artifacts
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache .cache/pip
      uses: actions/cache@v5
      id: cache-pip
      with:
        path: ~/.cache/pip
        key: pip_cache_py_${{ matrix.python-version }}_gxy_${{ needs.setup.outputs.galaxy-head-sha }}
    - name: Combine outputs
      uses: galaxyproject/planemo-ci-action@v1
      id: combine
      with:
        mode: combine
        html-report: true
        markdown-report: true
    - uses: actions/upload-artifact@v7
      with:
        name: 'All tool test results'
        path: upload
    - run: cat upload/tool_test_output.md >> $GITHUB_STEP_SUMMARY
    - name: Check outputs
      uses: galaxyproject/planemo-ci-action@v1
      id: check
      with:
        mode: check
    - name: Check if all test chunks succeeded
      run: |
        NFILES=$(find artifacts/ -name "tool_test_output.json" | wc -l)
        if [[ "${{ needs.setup.outputs.chunk-count }}" != "$NFILES" ]]; then
          exit 1
        fi

  # deploy the tools to the toolsheds (first TTS for testing)
  deploy:
    name: Deploy
    needs: [setup, lint, combine_outputs]
    if: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' ) && github.repository_owner == 'goeckslab' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache .cache/pip
      uses: actions/cache@v5
      id: cache-pip
      with:
        path: ~/.cache/pip
        key: pip_cache_py_${{ matrix.python-version }}_gxy_${{ needs.setup.outputs.galaxy-head-sha }}
    - name: Deploy on testtoolshed
      uses: galaxyproject/planemo-ci-action@v1
      with:
        mode: deploy
        repository-list: ${{ needs.setup.outputs.repository-list }}
        shed-target: testtoolshed
        shed-key: ${{ secrets.TTS_API_KEY }}
      continue-on-error: true
    - name: Deploy on toolshed
      uses: galaxyproject/planemo-ci-action@v1
      with:
        mode: deploy
        repository-list: ${{ needs.setup.outputs.repository-list }}
        shed-target: toolshed
        shed-key: ${{ secrets.TS_API_KEY }}

  deploy-reminder:
    name: Create server update reminder issue
    needs: [deploy]
    if: ${{ needs.deploy.result == 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.repository_owner == 'goeckslab' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
    - name: Get PR object
      uses: 8BitJonny/gh-get-current-pr@2.2.0
      id: getpr
      with:
        sha: ${{ github.event.after }}
    - name: Create reminder issue
      if: ${{ steps.getpr.outputs.number != '' }}
      uses: actions/github-script@v7
      env:
        REMINDER_ASSIGNEE: ${{ vars.REMINDER_ASSIGNEE || 'qchiujunhao' }}
        REMINDER_LABELS: ${{ vars.REMINDER_LABELS || 'ops' }}
        PR_NUMBER: ${{ steps.getpr.outputs.number }}
      with:
        github-token: ${{ github.token }}
        script: |
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const prNumber = Number(process.env.PR_NUMBER);

          const { data: pr } = await github.rest.pulls.get({
            owner,
            repo,
            pull_number: prNumber,
          });

          const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
            owner,
            repo,
            pull_number: pr.number,
            per_page: 100,
          });

          const isRelevantToolPath = (filename) =>
            filename.startsWith("tools/") &&
            !filename.includes("/test-data/") &&
            !filename.endsWith("/README.md") &&
            !filename.endsWith("/LICENSE");

          const relevantToolFiles = changedFiles.flatMap((file) => {
            const paths = [file.filename];
            if (file.previous_filename) {
              paths.push(file.previous_filename);
            }

            const relevantPaths = [...new Set(paths.filter(isRelevantToolPath))];
            if (relevantPaths.length === 0) {
              return [];
            }

            if (
              file.status === "renamed" &&
              file.previous_filename &&
              file.previous_filename !== file.filename
            ) {
              return [`${file.previous_filename} -> ${file.filename}`];
            }

            return relevantPaths;
          });

          if (relevantToolFiles.length === 0) {
            core.info("No relevant files changed under tools/. Skipping reminder issue.");
            return;
          }

          if (pr.base.ref !== "main") {
            core.info(`PR #${pr.number} targets ${pr.base.ref}, not main. Skipping reminder issue.`);
            return;
          }

          if (!pr.merged_at) {
            core.info(`PR #${pr.number} is not merged. Skipping reminder issue.`);
            return;
          }

          const assignees = process.env.REMINDER_ASSIGNEE
            ? [process.env.REMINDER_ASSIGNEE]
            : [];

          const requestedLabels = process.env.REMINDER_LABELS
            ? process.env.REMINDER_LABELS.split(",").map((label) => label.trim()).filter(Boolean)
            : [];
          const prSummaryLine = `PR #${pr.number} (${pr.title}) was merged into \`main\` by @${pr.merged_by?.login || "unknown"}.`;

          const title = `Reminder: update cancer server after PR #${pr.number}`;
          const body = [
            prSummaryLine,
            "",
            "Follow-up checklist:",
            "- [ ] Update the cancer server.",
            "- [ ] Monitor the main server update.",
            "",
            "Relevant tool files changed:",
            ...relevantToolFiles.map((filename) => `- \`${filename}\``),
            "",
            `Merged PR: ${pr.html_url}`,
            `Merge commit: ${pr.merge_commit_sha || "n/a"}`,
          ].join("\n");

          const { data: existingIssues } = await github.rest.search.issuesAndPullRequests({
            q: `repo:${owner}/${repo} is:issue is:open "${title}"`,
          });

          if (existingIssues.total_count > 0) {
            core.info(`Reminder issue already exists: ${existingIssues.items[0].html_url}`);
            return;
          }

          let labels = [];
          if (requestedLabels.length > 0) {
            const repoLabels = await github.paginate(github.rest.issues.listLabelsForRepo, {
              owner,
              repo,
              per_page: 100,
            });
            const availableLabels = new Set(repoLabels.map((label) => label.name));
            labels = requestedLabels.filter((label) => availableLabels.has(label));
          }

          const issuePayload = { owner, repo, title, body };
          if (labels.length > 0) {
            issuePayload.labels = labels;
          }

          try {
            if (assignees.length > 0) {
              issuePayload.assignees = assignees;
            }
            await github.rest.issues.create(issuePayload);
          } catch (error) {
            if (assignees.length > 0) {
              core.warning(`Issue created without assignee: ${error.message}`);
              delete issuePayload.assignees;
              await github.rest.issues.create(issuePayload);
              return;
            }
            throw error;
          }

  deploy-report:
    name: Report deploy status
    needs: [deploy]
    if: ${{ always() && needs.deploy.result != 'success' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' ) && github.repository_owner == 'goeckslab' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
    # report to the PR if deployment failed
    - name: Get PR object
      uses: 8BitJonny/gh-get-current-pr@2.2.0
      id: getpr
      with:
        sha: ${{ github.event.after }}
    - name: Create comment
      uses: peter-evans/create-or-update-comment@v4
      with:
        token: ${{ github.token }}
        issue-number: ${{ steps.getpr.outputs.number }}
        body: |
          Attention: deployment ${{ needs.deploy.result }}!

          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

  determine-success:
    name: Check workflow success
    needs: [setup, lint, flake8, file_sizes, combine_outputs]
    if: ${{ always() && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
    - name: Check tool lint status
      if: ${{ needs.lint.result != 'success' && needs.flake8.result != 'skipped' }}
      run: exit 1
    - name: Indicate Python script lint status
      if: ${{ needs.flake8.result != 'success' && needs.flake8.result != 'skipped' }}
      run: exit 1
    - name: Indicate file size check status
      if: ${{ needs.file_sizes.result != 'success' && needs.file_sizes.result != 'skipped' }}
      run: exit 1
    - name: Check tool test status
      if: ${{ needs.combine_outputs.result != 'success' && needs.combine_outputs.result != 'skipped' }}
      run: exit 1
