name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gleam-gh-pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          path: source

      - name: Check out Pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Copy site root
        run: |
          set -euo pipefail
          find gh-pages -mindepth 1 -maxdepth 1 ! -name .git ! -name previews -exec rm -rf {} +
          rsync -a source/docs/ gh-pages/
          touch gh-pages/.nojekyll

      - name: Commit site root
        run: |
          set -euo pipefail
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll .
          if git diff --cached --quiet; then
            echo "GitHub Pages site is already up to date."
            exit 0
          fi
          git commit -m "Update GitHub Pages site"
          git push origin HEAD:gh-pages
